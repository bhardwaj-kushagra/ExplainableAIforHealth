name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black
    
    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Check code formatting with black
      run: |
        black --check src tests
      continue-on-error: true
    
    - name: Generate synthetic data
      run: |
        python data_synthetic/generate_synthetic.py --seed 42
    
    - name: Run preprocessing
      run: |
        python src/preprocess.py --input data_synthetic/region_daily.csv --output data_processed/region_daily.parquet
    
    - name: Train models
      run: |
        python src/models/xgb_train.py
        python src/explainers.py
    
    - name: Run unit tests
      run: |
        pytest -v --tb=short
    
    - name: Generate visualizations
      run: |
        python src/viz.py
    
    - name: Test API startup
      run: |
        timeout 10 uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        curl -f http://localhost:8000/health || exit 1
      continue-on-error: true
    
    - name: Upload test artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-outputs
        path: outputs/
        retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: |
        docker build -t explainable-ai-cvd:${{ github.sha }} .
    
    - name: Test Docker image
      run: |
        docker run --rm explainable-ai-cvd:${{ github.sha }} python -c "import sys; print(sys.version)"
